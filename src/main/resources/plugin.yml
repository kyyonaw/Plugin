name: DojutsuMarca
main: com.servidor.dojutsu.DojutsuPlugin
version: 1.0.0
api-version: '1.20'
description: Dojutsus y sistema de marca con etapas y desgaste.
commands:
  dojutsu:
    description: Activa y administra dojutsus.
    usage: /dojutsu [id|lista|dar|quitar|recargar]
    aliases: [doj]
  marca:
    description: Activa y administra la marca.
    usage: /marca [etapa|estado|dar|quitar|desgaste]
permissions:
  dojutsu.usar:
    description: Permite usar dojutsus y la marca.
    default: true
  dojutsu.admin:
    description: Permite dar/quitar dojutsus y marcas.
    default: op
